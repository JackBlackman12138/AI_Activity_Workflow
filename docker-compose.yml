services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activity_studio
      POSTGRES_USER: activity
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - activity_studio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activity -d activity_studio"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  activity_studio_db:
